
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Vivek</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <h1>Photo Gallery</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">Gallery</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <!-- Main Gallery -->
        <main class="gallery">
            <h2>Explore Beautiful Places</h2>
            <p>Discover the beauty of nature through photography.</p>

            <section class="grid">

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Beautiful mountain landscape">
                    <h3>Mountain View</h3>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake surrounded by mountains">
                    <h3>Beautiful Lake</h3>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Green forest">
                    <h3>Green Forest</h3>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beautiful beach">
                    <h3>Sunny Beach</h3>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600" alt="Wildlife in nature">
                    <h3>Wildlife</h3>
                </div>

                <div class="card">
                    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600" alt="Snowy mountain under stars">
                    <h3>Snowy Mountains</h3>
                </div>

            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 Vivek | My Photo Gallery</p>
        </footer>

    </div>

</body>
</html>
